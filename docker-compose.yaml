services:
  mysql:
    image: mysql:8.0
    container_name: lightning-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lightning
      MYSQL_USER: lightning
      MYSQL_PASSWORD: lightning
    ports:
      - "3306:3306"
    volumes:
      - ./datas/mysql/:/var/lib/mysql/
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-uroot"
        - "-prootpass"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  lightning-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightning-app
    container_name: lightning-server
    environment:
      DATABASE_URL: mysql://lightning:lightning@mysql:3306/lightning
    ports:
      - "8000:8000"
    volumes:
      - ./datas/lightning/:/root/.local/share/lightning/
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "lightning", "serve", "--host", "0.0.0.0", "--no-access-log"]

  lightning-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightning-app
    container_name: lightning-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/lightning/dispatch.yaml
    depends_on:
      lightning-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "lightning", "dispatch", "--config", "dispatch.yaml"]
