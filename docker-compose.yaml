services:
  lightning-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightning-app
    container_name: lightning-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/lightning/:/root/.local/share/lightning/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "lightning", "serve", "--host", "0.0.0.0", "--no-access-log"]
  lightning-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightning-app
    container_name: lightning-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/lightning/dispatch.yaml
    depends_on:
      lightning-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "lightning", "dispatch", "--config", "dispatch.yaml"]
